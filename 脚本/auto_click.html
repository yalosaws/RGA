<section id="sec-click" class="ac-page" hidden>
  <div class="ac-state"><span id="ac-dot"></span><strong id="ac-state">已停止</strong><span id="ac-shortcut">F8 启动 / 停止</span></div>
  <p class="ac-help">把鼠标移到游戏中要点击的位置，按快捷键即可连点，再按一次停止。切到其他窗口或把鼠标移出游戏时暂停，回到游戏后继续。</p>
  <p id="ac-error" class="ac-error" role="alert" hidden></p>
  <form id="ac-form">
    <div class="ac-field"><label for="ac-key">启停快捷键</label><div class="ac-keys">
      <label><input type="checkbox" id="ac-ctrl"> Ctrl</label>
      <label><input type="checkbox" id="ac-alt"> Alt</label>
      <label><input type="checkbox" id="ac-shift"> Shift</label>
      <select id="ac-key" aria-label="快捷键主键"></select>
    </div></div>
    <div class="ac-field"><label for="ac-interval">点击间隔</label><div class="ac-interval"><input id="ac-interval" type="number" min="10" max="10000" step="1" value="35" required><span>毫秒</span><small id="ac-rate">约 28.6 次 / 秒</small></div></div>
    <div class="ac-actions"><button id="ac-save" type="submit" disabled>保存设置</button><button id="ac-toggle" type="button" class="ac-primary" disabled>启动连点</button><span id="ac-saved" role="status"></span></div>
  </form>
  <p class="ac-note">默认 F8、35 毫秒，点击当前鼠标位置的左键。保存设置后连点会停止；重新打开程序时保持停止。</p>
</section>
<style>
main>section.ac-page{max-width:860px;margin:0 auto}
.ac-state{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
#ac-dot{width:10px;height:10px;border-radius:50%;background:#c3ccda}
#ac-dot.on{background:#2563eb;box-shadow:0 0 0 4px #e8efff}
#ac-state{font-size:18px} #ac-shortcut{margin-left:auto;color:var(--muted);font-size:13px}
.ac-help{color:#526079;line-height:1.8;margin:0 0 28px;font-size:14px}
.ac-field{padding:22px 0;border-top:1px solid var(--line)}
.ac-field>label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}
.ac-keys,.ac-interval,.ac-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ac-keys label{display:inline-flex;align-items:center;gap:4px;font-size:14px;cursor:pointer}
.ac-page input[type=checkbox]{accent-color:var(--blue)}
.ac-page select,.ac-page input[type=number]{font:inherit;font-size:14px;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.ac-page select{min-width:110px} #ac-interval{width:110px}
.ac-page select:focus,.ac-page input:focus{outline:2px solid #c7d9fc;outline-offset:2px}
.ac-interval span{font-size:14px;color:#526079} #ac-rate{color:var(--muted);font-size:13px}
.ac-actions{margin:8px 0 24px;gap:12px}
.ac-actions button{font:inherit;font-size:14px;padding:9px 20px;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:11px;cursor:pointer}
.ac-actions button.ac-primary{color:#fff;background:var(--blue);border-color:var(--blue)}
.ac-actions button:disabled{opacity:.45;cursor:default}
.ac-error{background:#fff1f1;color:#b91c1c;border-radius:12px;padding:10px 14px;font-size:13px}
.ac-note{font-size:12px;color:var(--muted);line-height:1.8;margin:0}
#ac-saved{color:#2563eb;font-size:13px}
nav a[data-sec=click].ac-on:after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-left:10px;vertical-align:middle}
</style>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); }, api = null, polling = false, busy = false, initialized = false, serviceError = '';
  var select = $('ac-key');
  var keys = [];
  for (var i = 1; i <= 11; i++) keys.push('F' + i);
  keys = keys.concat('ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split(''), ['Space', 'Home', 'End', 'Insert', 'Delete']);
  keys.forEach(function(key){ var option = document.createElement('option'); option.value = key; option.textContent = key === 'Space' ? '空格' : key; select.appendChild(option); });
  select.value = 'F8';
  function error(message){ $('ac-error').hidden = !message; $('ac-error').textContent = message || ''; }
  function rate(){
    var interval = Number($('ac-interval').value);
    $('ac-rate').textContent = interval >= 10 && interval <= 10000 ? '约 ' + (1000 / interval).toLocaleString('zh-CN', {maximumFractionDigits:1}) + ' 次 / 秒' : '';
  }
  function fill(settings){
    select.value = settings.key;
    ['ctrl','alt','shift'].forEach(function(k){ $('ac-' + k).checked = settings[k]; });
    $('ac-interval').value = settings.interval; rate();
  }
  function render(state){
    $('ac-state').textContent = state.enabled ? (state.clicking ? '连点中' : '等待游戏窗口 / 鼠标移入') : '已停止';
    $('ac-dot').classList.toggle('on', state.enabled);
    $('ac-shortcut').textContent = state.hotkey + ' 启动 / 停止';
    $('ac-toggle').textContent = state.enabled ? '停止连点' : '启动连点';
    $('ac-toggle').disabled = busy || !state.registered;
    var nav = document.querySelector('nav a[data-sec=click]');
    if (nav) { nav.classList.toggle('ac-on', state.enabled); nav.title = state.enabled ? '自动点击已开启 · ' + state.hotkey + ' 停止' : '自动点击 · ' + state.hotkey; }
    if (state.error) error(state.error);
    else if (serviceError) error('');
    serviceError = state.error || '';
  }
  async function poll(){
    if (!api || polling || busy) return;
    polling = true;
    try {
      var state = await api.click_status();
      if (state.ok) {
        if (!initialized) { fill(state.settings); initialized = true; }
        render(state);
      } else error(state.error);
    } catch (e) { error('无法连接自动点击服务，请重新打开 RGA。'); }
    finally { polling = false; }
  }
  function connect(){
    if (api || !window.pywebview || !window.pywebview.api || !window.pywebview.api.click_status) return;
    api = window.pywebview.api;
    $('ac-save').disabled = false;
    error(''); poll(); setInterval(poll, 500);
  }
  $('ac-interval').addEventListener('input', rate);
  $('ac-form').addEventListener('input', function(){ $('ac-saved').textContent = ''; });
  $('ac-form').addEventListener('submit', async function(e){
    e.preventDefault(); if (!api || busy) return;
    busy = true; $('ac-save').disabled = $('ac-toggle').disabled = true; error('');
    var settings = {key: select.value, interval: Number($('ac-interval').value)};
    ['ctrl','alt','shift'].forEach(function(k){ settings[k] = $('ac-' + k).checked; });
    try {
      var state = await api.click_configure(settings);
      if (state.ok) { fill(state.settings); $('ac-saved').textContent = '已保存'; render(state); }
      else error(state.error);
    } catch (e) { error('设置保存失败，请重试。'); }
    finally { busy = false; $('ac-save').disabled = false; poll(); }
  });
  $('ac-toggle').addEventListener('click', async function(){
    if (!api || busy) return;
    busy = true; $('ac-toggle').disabled = true; error('');
    try { var state = await api.click_toggle(); if (state.ok) render(state); else error(state.error); }
    catch (e) { error('无法切换连点状态，请重试。'); }
    finally { busy = false; poll(); }
  });
  window.addEventListener('pywebviewready', connect);
  connect();
  if (!api) error('自动点击需要在 RGA 桌面程序中使用。');
})();
</script>
