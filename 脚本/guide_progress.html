<style>
.guide a[class^="t-"]{transition:color .45s ease}
.guide.guide-gray a.guide-unlocked{color:#939dad}
/* 图例末尾的「已解锁」：和图例里的类别一样是小胶囊，点一下选中，选中时底色变灰 */
.legend .guide-gray-toggle{display:inline-block;margin:0 1px;padding:1px 7px;border:0;border-radius:999px;background:transparent;
  color:#7b879b;font:inherit;font-weight:600;white-space:nowrap;cursor:pointer;vertical-align:baseline;transition:background .2s,color .2s}
.legend .guide-gray-toggle::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:#939dad;margin-right:4px}
.legend .guide-gray-toggle:hover{background:rgba(100,116,139,.1)}
.legend .guide-gray-toggle[aria-checked=true]{background:rgba(100,116,139,.2);color:#475569}
.legend .guide-gray-toggle.pop{animation:gp-pop .3s ease}
@keyframes gp-pop{40%{transform:scale(.9)}100%{transform:scale(1)}}
.legend .guide-gray-toggle:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
</style>
<script>
(function(){
  var sections = Array.from(document.querySelectorAll('#sec-r0, #gd-a0, #gd-a1'));
  var buttons = [], entries = [], known = new Set(), hasSave = false, enabled = false;
  try { enabled = localStorage.getItem('rg-guide-gray') === '1'; } catch (e) {}
  sections.forEach(function(sec){
    var legend = sec.querySelector('.legend');
    if (!legend) return;
    var button = document.createElement('button');
    button.type = 'button'; button.className = 'guide-gray-toggle';
    button.setAttribute('role', 'switch');
    button.setAttribute('aria-label', '将已解锁内容显示为灰色超链接');
    button.title = '根据存档标记已解锁内容，链接仍可点击';
    button.appendChild(document.createTextNode('已解锁'));
    legend.appendChild(button); buttons.push(button);
    button.addEventListener('click', function(){
      enabled = !enabled;
      try { localStorage.setItem('rg-guide-gray', enabled ? '1' : '0'); } catch (e) {}
      button.classList.remove('pop'); void button.offsetWidth; button.classList.add('pop');
      sweep();
      paint();
    });
    sec.querySelectorAll('a[class^="t-"]').forEach(function(link){
      var kind = link.classList[0].slice(2), name = link.textContent.replace(/\s+/g, '').toLowerCase();
      var target = (link.getAttribute('href') || '').replace(/^#/, '');
      entries.push({link:link, kind:kind, name:name, target:target});
    });
  });
  // 点「已解锁」时链接从上到下依次变色：按链接在屏幕上的位置错开过渡开始的时间
  var sweepTimer = 0;
  function sweep(){
    var h = window.innerHeight || 800;
    entries.forEach(function(item){
      var top = item.link.getBoundingClientRect().top;
      item.link.style.transitionDelay = Math.round(Math.max(0, Math.min(1, top / h)) * 500) + 'ms';
    });
    clearTimeout(sweepTimer);
    sweepTimer = setTimeout(function(){ entries.forEach(function(item){ item.link.style.transitionDelay = ''; }); }, 1100);
  }
  function paint(){
    sections.forEach(function(sec){ sec.classList.toggle('guide-gray', enabled); });
    buttons.forEach(function(button){
      button.setAttribute('aria-checked', String(enabled));
      button.title = hasSave ? '根据存档标记已解锁内容，链接仍可点击' : '读取游戏存档后自动标记已解锁内容';
    });
    entries.forEach(function(item){
      var target = document.getElementById(item.target);
      // 链接指向的资料卡片已标成已获得 / 已解锁（例如写成「升」的隐藏奖杯升级），也算已解锁
      var fromCard = target && target.classList.contains('own') && /^t(3|5|7|10)-/.test(item.target);
      var unlocked = known.has(item.kind + ':' + item.name) || known.has(item.kind + '@' + item.target) || fromCard;
      item.link.classList.toggle('guide-unlocked', !!unlocked);
    });
  }
  window.addEventListener('guideunlocked', function(e){
    hasSave = e.detail !== null; known = new Set(e.detail || []); paint();
  });
  ['researchowned','challengeowned','artowned','trophyowned'].forEach(function(type){ window.addEventListener(type, paint); });
  paint();
})();
</script>
